name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Validate tag matches package.json
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "::error::Tag v$TAG != package.json $PKG"; exit 1; }

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm test:docker

      - run: pnpm build

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Gated by the "release" GitHub Environment (required reviewer) and the npm
    # trusted publisher, whose environment claim must match this value.
    environment: release
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24's bundled npm can
      # be older. No NPM_TOKEN: npm exchanges a short-lived OIDC token instead,
      # and emits provenance automatically.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      # prepack (clean + tsc) rebuilds dist before packing.
      - run: npm publish --access public
